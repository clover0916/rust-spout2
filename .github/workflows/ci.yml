name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      RUST_SPOUT2_ALLOW_FETCH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # autocxx 0.26 cannot parse every runner-bundled libclang version.
      - name: Install tested libclang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.8"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe
          directory: ${{ runner.temp }}/llvm20
          env: false

      - name: Select libclang
        run: '"LIBCLANG_PATH=$env:LLVM_PATH/bin" >> $env:GITHUB_ENV'

      - name: Cargo check
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Link and test DirectX API
        run: cargo test --target x86_64-pc-windows-msvc
