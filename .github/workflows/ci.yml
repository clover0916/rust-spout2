name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      RUST_SPOUT2_ALLOW_FETCH: "1"
      LIBCLANG_PATH: ${{ runner.temp }}/llvm22/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # autocxx 0.26 cannot parse every runner-bundled libclang version.
      - name: Install tested libclang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.1"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.1/LLVM-22.1.1-win64.exe
          directory: ${{ runner.temp }}/llvm22
          env: false

      - name: Cargo check
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Link and test DirectX API
        run: cargo test --target x86_64-pc-windows-msvc
